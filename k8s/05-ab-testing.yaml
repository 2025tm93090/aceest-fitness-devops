# Strategy 4: A/B Testing Deployment
# Routes traffic based on HTTP Request Headers or Cookies for data-driven experimentation

# 1. VARIANT A: CONTROL GROUP (Standard Catalog)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-app-a
  namespace: aceest-fitness
  labels:
    app: aceest-ab
    variant: a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-ab
      variant: a
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: a
    spec:
      containers:
        - name: aceest-container
          image: 2025tm93090/aceest-fitness:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1.0.0-VariantA"
            - name: DEPLOYMENT_STRATEGY
              value: "ABTesting-A"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-service-a
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-ab
    variant: a
  ports:
    - port: 80
      targetPort: 5000
---
# 2. VARIANT B: TREATMENT GROUP (AI Workout Recommendation Engine)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-app-b
  namespace: aceest-fitness
  labels:
    app: aceest-ab
    variant: b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-ab
      variant: b
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: b
    spec:
      containers:
        - name: aceest-container
          image: 2025tm93090/aceest-fitness:v3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v3.0.0-VariantB"
            - name: DEPLOYMENT_STRATEGY
              value: "ABTesting-B"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-service-b
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-ab
    variant: b
  ports:
    - port: 80
      targetPort: 5000
---
# 3. BASE INGRESS ROUTING TO VARIANT A
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-primary-ingress
  namespace: aceest-fitness
spec:
  rules:
    - host: ab.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-service-a
                port:
                  number: 80
---
# 4. CANARY/HEADER-BASED INGRESS ROUTING TO VARIANT B
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-experiment-ingress
  namespace: aceest-fitness
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Experiment"
    nginx.ingress.kubernetes.io/canary-by-header-value: "variant-b"
spec:
  rules:
    - host: ab.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-service-b
                port:
                  number: 80
