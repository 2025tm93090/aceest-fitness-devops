# Strategy 2: Blue-Green Deployment
# Two identical environments: Blue (Active/Live) and Green (Staging/Target)
# Router Service switches traffic atomically by updating selector app-version

# BLUE ENVIRONMENT (Current Live: v1.0.0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest-fitness
  labels:
    app: aceest-bluegreen
    slot: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bluegreen
      app-version: blue
  template:
    metadata:
      labels:
        app: aceest-bluegreen
        app-version: blue
    spec:
      containers:
        - name: aceest-container
          image: 2025tm93090/aceest-fitness:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: COLOR_VARIANT
              value: "blue"
            - name: APP_VERSION
              value: "v1.0.0"
            - name: DEPLOYMENT_STRATEGY
              value: "BlueGreen"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# GREEN ENVIRONMENT (New Staging/Release: v2.0.0 / v3.0.0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest-fitness
  labels:
    app: aceest-bluegreen
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bluegreen
      app-version: green
  template:
    metadata:
      labels:
        app: aceest-bluegreen
        app-version: green
    spec:
      containers:
        - name: aceest-container
          image: 2025tm93090/aceest-fitness:v3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: COLOR_VARIANT
              value: "green"
            - name: APP_VERSION
              value: "v3.0.0"
            - name: DEPLOYMENT_STRATEGY
              value: "BlueGreen"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# ACTIVE ROUTER SERVICE
# Switches between 'blue' and 'green' by toggling selector app-version
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen-service
  namespace: aceest-fitness
  labels:
    app: aceest-bluegreen
spec:
  type: NodePort
  selector:
    app: aceest-bluegreen
    app-version: blue  # Change to 'green' to switch traffic
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30081
