# SonarQube Scanner Configuration for ACEest Fitness
# Assignment CSIZG514/SEZG514 - DevOps CI/CD Implementation

sonar.projectKey=aceest-fitness-app
sonar.projectName=ACEest Fitness & Gym DevOps Platform
sonar.projectVersion=3.0.0

# Source & Test Code Layout
sonar.sources=app,ACEest_Fitness.py
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python Analysis Settings
sonar.python.version=3.11
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# Quality Gate Metric Constraints
sonar.qualitygate.wait=true

# Exclusions
sonar.exclusions=**/__pycache__/**,**/reports/**,**/site-packages/**,**/k8s/**,**/scripts/**
sonar.coverage.exclusions=tests/**,ACEest_Fitness.py
